name: CD

# 仅由 main 分支上 CI 成功的结果触发，部署的就是 CI 产出的那份构建产物
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # 在仓库 Settings -> Environments 中为 production 配置 Required reviewers，实现生产发布人工确认
    environment: production
    steps:
      - name: 下载 CI 产物
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 发布
        run: |
          ls -l dist
          # TODO: 换成实际发布命令（上传制品库 / 推送到部署环境）
          echo "ready to deploy"
